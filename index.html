<script>
/* ---------- تتبع الزوار ---------- */
function trackVisitor(){
  // لا نتبع الزوار لو كان مسجل دخوله
  if(localStorage.getItem('diraz_admin_pass')) return;
  
  var today = new Date().toDateString();
  var lastVisit = localStorage.getItem('diraz_last_visit');
  
  // إذا أول زيارة للموقع، زد العداد
  if(!lastVisit){
    var totalVisitors = parseInt(localStorage.getItem('diraz_visitors') || '0') + 1;
    localStorage.setItem('diraz_visitors', totalVisitors);
    localStorage.setItem('diraz_last_visit', today);
    localStorage.setItem('diraz_first_visit', today);
  }
  // إذا اليوم جديد، زد زوار اليوم
  else if(lastVisit !== today){
    var todayVisitors = parseInt(localStorage.getItem('diraz_today_visitors') || '0') + 1;
    localStorage.setItem('diraz_today_visitors', todayVisitors);
    localStorage.setItem('diraz_last_visit', today);
  }
  
  // إذا أول زيارة للأسبوع، زد زوار الأسبوع
  var weekStart = getWeekStart(new Date());
  var weekKey = 'diraz_week_' + weekStart.toISOString().split('T')[0];
  if(!localStorage.getItem(weekKey)){
    localStorage.setItem(weekKey, '1');
    var weekVisitors = parseInt(localStorage.getItem('diraz_week_visitors') || '0') + 1;
    localStorage.setItem('diraz_week_visitors', weekVisitors);
  }
}

function getWeekStart(date){
  var d = new Date(date);
  var day = d.getDay();
  var diff = d.getDate() - day + (day === 0 ? -6 : 1); // الأحد = 0
  return new Date(d.setDate(diff));
}

// تشغيل التتبع عند تحميل الصفحة

  function drawLabel(){
    var c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    if(logoReady){ var lw = 1.36 * PX, lh = lw / 1.99; c.drawImage(logoImg, (cv.width - lw)/2, yOf(1.61) - lh/2, lw, lh); }
    c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    var fam = '"Playfair Display", Georgia, serif';
    c.font = '400 100px ' + fam;
    var w = c.measureText('50 ml').width, size = 100 * (0.5 * PX) / w;
    c.font = '400 ' + size.toFixed(1) + 'px ' + fam;
    c.fillText('50 ml', cv.width/2, yOf(0.42));
    tex.needsUpdate = true;
  }
  drawLabel();
  if(document.fonts && document.fonts.load) document.fonts.load('400 40px "Playfair Display"').then(drawLabel).catch(function(){});
  // ===== الطباعة الخلفية: نفس الشعار تماماً (نفس الـ texture) حتى ما تبقى الزجاجة فارغة من ورا =====
  var label2 = new THREE.Mesh(
    new THREE.CylinderGeometry(LAB_R, LAB_R, LAB_H, 64, 1, true, -ARC/LAB_R/2, ARC/LAB_R),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.95, depthWrite:false })
  );
  label2.position.y = LAB_BOTTOM + LAB_H/2; label2.renderOrder = 3; label2.rotation.y = Math.PI;   // الجهة الخلفية

  var label = new THREE.Mesh(
    new THREE.CylinderGeometry(LAB_R, LAB_R, LAB_H, 64, 1, true, -ARC/LAB_R/2, ARC/LAB_R),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.95, depthWrite:false })
  );
  label.position.y = LAB_BOTTOM + LAB_H/2; label.renderOrder = 3;

  // ===== التجميع: yaw (دوران حول المحور العمودي) داخل tilt (إمالة لفوق وتحت) =====
  var bottle = new THREE.Group();
  bottle.add(tube, cap, seam, bodyBack, bodyFront, label, label2);
  bottle.visible = false;                      // يظهر بعد تحميل لون الصورة
  bottle.position.y = -2.075;
  var yaw = new THREE.Group(); yaw.add(bottle);
  var tilt = new THREE.Group(); tilt.add(yaw); scene.add(tilt);

  function resize(){
    var w = box.clientWidth || 220, h = box.clientHeight || 367;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  resize();
  if('ResizeObserver' in window) new ResizeObserver(resize).observe(box); else window.addEventListener('resize', resize);

  // ===== الدوران فقط (بدون أي تحريك من المستخدم) =====
  var angle = 0, last = performance.now(), running = false;
  tilt.rotation.x = TILT_REST;
  tilt.position.y = 0;

  function frame(now){
    if(!running) return;
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    if(!reduce) angle = (angle + AUTO * dt) % (Math.PI * 2);
    yaw.rotation.y = angle;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  function start(){ if(running) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
  function stop(){ running = false; }
  if('IntersectionObserver' in window) new IntersectionObserver(function(en){ en[0].isIntersecting ? start() : stop(); }).observe(stage);
  else start();
})();
